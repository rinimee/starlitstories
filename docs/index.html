<!DOCTYPE html>
<html>
<head> <!-- this is the html file that helps set up the front end of the app! -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>starlit stories ⋆⭒˚.⋆</title>
    <link rel="icon" type="image/jpeg" href="static/starlit-stories-icon.jpeg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&display=swap" rel="stylesheet">
    <!--nummy styleeee (pretend im drooling or something idk) -->
    <style>
        .page-shell {
            --font: 'UnifrakturMaguntia', cursive;
            --border: #846C58;
            --glass: rgba(255, 255, 255, 0.08);
            font-family: var(--font);
            background: #0b0c1a url('static/starrybg.png') center / cover fixed no-repeat;
            color: #f5f5f5;
            margin: 0; padding: 20px; min-height: 100vh; box-sizing: border-box;
        }

        .main-title {
            display: flex; align-items: center; justify-content: center; gap: 14px;
            margin-bottom: 20px; font-weight: normal;
        }

        .main-title img {
            width: min(360px, 55vw); height: auto; display: block;
        }

        .content-row {
            display: flex; justify-content: center; align-items: stretch; gap: 60px;
            margin: 20px auto 0; width: min(1260px, 96vw);
            flex-direction: row-reverse;
        }

        .chat-panel {
            border: 2px solid var(--border); padding: 20px; border-radius: 18px;
            width: min(520px, 50vw); height: 600px;
            max-height: calc(100vh - 180px);
            overflow: hidden;
            display: flex; flex-direction: column; gap: 12px; box-sizing: border-box;
            background: rgba(10, 12, 26, 0.72); backdrop-filter: blur(6px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        .chat-panel h1 {
            font-size: 1.5em; margin-bottom: 10px;
        }

        .story-title {
            outline: none; cursor: text; min-height: 1.5em;
        }

        .primary-btn, .message-input {
            font-family: var(--font);
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        .message-input {
            flex: 1; background: #554C5B; color: #f5f5f5; padding: 8px;
        }

        .message-input::placeholder {
            color: #d1c4b2; font-style: italic;
        }

        .chat-output {
            flex: 1; height: 0; min-height: 0; display: flex; flex-direction: column;
            gap: 8px; overflow-y: scroll; padding-right: 4px;
            scrollbar-color: var(--border) rgba(10, 12, 26, 0.35);
        }

        .chat-output p {
            margin: 0; max-width: 80%; padding: 10px 12px; border-radius: 16px;
            line-height: 1.4; overflow-wrap: break-word; color: #d1c4b2;
        }

        .chat-output .user-msg {
            align-self: flex-start; background: var(--glass); border-bottom-left-radius: 6px;
        }

        .chat-output .starry-msg {
            align-self: flex-end; background: rgba(132, 99, 88, 0.9); border-bottom-right-radius: 6px;
        }

        .chat-form {
            margin-top: auto; display: flex; align-items: center; gap: 8px;
        }

        .send-btn, .upload-btn, .primary-btn, .save-btn, .delete-chat-btn {
            background: #23233c; color: #9b8877; border: 1px solid var(--border);
            outline: 1px solid rgba(245, 214, 179, 0.45);
            padding: 8px 14px; text-align: center; font-size: 16px; cursor: pointer;
            font-family: var(--font); border-radius: 12px;
        }

        .ideas-container {
            border: 2px solid var(--border); padding: 18px; border-radius: 18px;
            width: min(620px, 58vw); height: 420px;
            max-height: calc(100vh - 240px); box-sizing: border-box;
            display: flex; flex-direction: column; gap: 12px;
            background: rgba(10, 12, 26, 0.72); backdrop-filter: blur(6px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            align-self: flex-end; margin-right: 0; overflow-y: auto;
        }

        .notes-title {
            margin: 0; font-size: 1.1em;
        }

        .ideas-textarea {
            width: 100%; flex: 1; min-height: 0; resize: none;
            border: 1px solid var(--border); border-radius: 12px; padding: 10px;
            background: #554C5B; color: #f5f5f5; box-sizing: border-box;
            font-family: var(--font); font-size: 0.95em;
        }

        .ideas-textarea::placeholder {
            color: #d1c4b2; font-style: italic;
        }

        .nav-btn.prev-btn, .nav-btn.next-btn {
            background: #23233c; color: #9b8877; border: 1px solid var(--border);
            outline: 1px solid rgba(245, 214, 179, 0.45);
            padding: 6px 12px; text-align: center; font-size: 14px; cursor: pointer;
            font-family: var(--font); border-radius: 10px;
        }

        .book-nav-wrap {
            width: 100%; min-height: 120px; margin: 0 auto;
            display: flex; align-items: center;
            background: url('static/scroll.png') center / 100% 100% no-repeat;
        }

        .book-nav {
            width: 76%; margin: 0 auto; display: flex; align-items: center;
            justify-content: space-between; gap: 12px;
        }

        .page-indicator {
            color: #5b3927; font-size: 1.1em;
        }

        .story-controls {
            width: 100%; margin: 0 auto 4px;
            display: flex; flex-direction: column; align-items: center;
        }

        .ideas-column {
            width: min(620px, 58vw); display: flex; flex-direction: column;
            gap: 8px;
        }

        .chat-column {
            width: min(520px, 50vw); display: flex; flex-direction: column;
            gap: 8px;
        }

        .chat-column .chat-panel {
            width: 100%;
        }

        .chat-note {
            margin: 0; min-height: 57px; padding: 9px 4px; box-sizing: border-box;
            color: #d1c4b2; text-align: center; display: flex; align-items: center;
            justify-content: center;
            font-family: var(--font); font-size: 0.9em; background: #554C5B; border-radius: 8px; border: 2px solid var(--border);
        }

    </style>
</head>
<body class="page-shell">
    <h1 class="main-title">
        <span aria-hidden="true">⋆⭒˚.⋆</span>
        <img src="static/starlit-stories-title.png" alt="starlit stories">
        <span aria-hidden="true">⋆⭒˚.⋆</span>
    </h1>
    <div class="content-row">
        <div class="chat-column">
            <div class="chat-panel"> <!-- this is the main container for the chat interface -->
                <h1 id="story-title" class="story-title" contenteditable="true" spellcheck="false">ready for a new journey? ‧₊˚✩彡</h1>
                <!-- chat output area -->
                <div id="chat-output" class="chat-output"></div>
                <form id="chat-form" class="chat-form">
                    <input type="file" id="img-input" class="image-input" accept="image/*" style="display: none;">
                    <button type="button" id="img-upload-btn" class="upload-btn"> image uploads ⋆.˚⭒⋆ </button>
                    <span id="file-name" class="file-name"></span>

                    <input type="text" id="user-input" class="message-input" placeholder="write your message..." />
                    <button type="submit" class="send-btn"><i>whoosh</i> ⊹ ࣪ ˖</button>
                </form>
            </div>
            <button id="delete-chat-btn" class="delete-chat-btn" type="button">delete page ⋆｡°✩</button>
            <!-- lil note because i love you guys and i want to give credit where credit is due~ -->
            <p id="chat-note" class="chat-note">made with love by rinimee ♡</p>
        </div>
        <div class="ideas-column">
            <div class="story-controls">
                <!-- new story button -->
                <button id="new-story-btn" class="primary-btn"> begin new journey ⊹ ࣪ ˖ ໒꒱</button>
                <div class="book-nav-wrap">
                    <!-- book nav -->
                    <div id="book-nav" class="book-nav">
                        <button id="prev-pg" class="nav-btn prev-btn">&larr; previous</button>
                        <span id="pg-indicator" class="page-indicator">1 / 1</span>
                        <button id="next-pg" class="nav-btn next-btn">next &rarr;</button>
                    </div>
                </div>
            </div>
            <div id="ideas-container" class="ideas-container">
                <h3 class="notes-title">plot notes .✦ ݁˖</h3>
                <textarea id="user-ideas" class="ideas-textarea" placeholder="now, what do 𝘺𝘰𝘶 think?"></textarea>
                <button id="save-btn" class="save-btn">save ⋆.˚⭒⋆</button>
            </div>
        </div>
    </div>
</body>
<script>
    // this script handles the front end logic for the chat interface and story management~
        let pages = JSON.parse(localStorage.getItem('starlit_pages')) || [ // array to hold the pages of the story
            {id: null, title: "nameless ✶⋆.˚", historyHtml: "", ideas: ""}
        ];

        function normalizeTitle(title) {
            return (title && title.trim()) ? title.trim() : 'nameless ✶⋆.˚';
        }

        function saveToLocalStorage(){
            localStorage.setItem('starlit_pages',JSON.stringify(pages));
        }

        let currentPageIndex = 0; // index of the current page

        const chatOutput = document.getElementById("chat-output");
        const pageIndicator = document.getElementById("pg-indicator");
        const storyTitle = document.getElementById("story-title");

        storyTitle.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                storyTitle.blur();
            }
        });

        storyTitle.addEventListener('blur', function() {
            const updatedTitle = storyTitle.textContent.trim() || 'nameless ✶⋆.˚';
            pages[currentPageIndex].title = updatedTitle;
            saveToLocalStorage();
        });

        // gets the ideas that the user puts in their notes for saving it
        const userIdeasInput = document.getElementById("user-ideas");
        const saveBtn = document.getElementById("save-btn")
       
        // helps with uploading img!
        const imageInput = document.getElementById("img-input");
        const fileNameSpan = document.getElementById("file-name");
        const imgUploadBtn = document.getElementById("img-upload-btn");

        imgUploadBtn.addEventListener("click", function(){
            imageInput.click();
        });
        // updates the file name when its selected durrr
        imageInput.addEventListener("change", function(){
            if (imageInput.files.length > 0) {
                fileNameSpan.textContent = `[${imageInput.files[0].name}]`;
            } else {
                fileNameSpan.textContent = "";
            }
        });

        // function to render the current page
        function renderCurrentPage(){
            const currentPage = pages[currentPageIndex];

            // update the chat output and page indicator
            chatOutput.innerHTML = currentPage.historyHtml;

            // update the story title
            pages[currentPageIndex].title = normalizeTitle(pages[currentPageIndex].title);
            storyTitle.innerText = pages[currentPageIndex].title;
            pageIndicator.innerText = `${currentPageIndex + 1} / ${pages.length}`;
        
            // disables nav if at start or end because duh
            document.getElementById("prev-pg").disabled = currentPageIndex === 0;
            document.getElementById("next-pg").disabled = currentPageIndex === pages.length - 1;
        
            userIdeasInput.value = currentPage.ideas || "";
        }
        
        // this baby saves the notes the user made ;)
        saveBtn.addEventListener('click',function() {
            pages[currentPageIndex].ideas = userIdeasInput.value;
            saveToLocalStorage();

            const originalText = saveBtn.innerText;
            saveBtn.innerText = "saved ՞. .՞𐦯"
            setTimeout(() => { // basically flashes the saved text for a couple milisecs
                saveBtn.innerText = originalText;
            }, 1500);
        });
        // this baby deletes the current page when the user clicks the delete button
        // this also took FOREVER to figure out how to do it without breaking the app so please be gentle with me ;-;
        document.getElementById("delete-chat-btn").addEventListener("click", function(){
            if (!confirm("delete this chat? starry will forgive you, dear ⋆⭒˚｡⋆")) return;

            pages.splice(currentPageIndex, 1);
            if (pages.length === 0) {
                pages.push({id: null, title: "nameless ✶⋆.˚", historyHtml: "", ideas: "", chatNote: ""});
            }
            currentPageIndex = Math.min(currentPageIndex, pages.length - 1);
            imageInput.value = "";
            fileNameSpan.textContent = "";
            saveToLocalStorage();
            renderCurrentPage();
        });
        
        // page flip to previous page
        document.getElementById("prev-pg").addEventListener('click', function(){
            if(currentPageIndex > 0){
                currentPageIndex--;
                renderCurrentPage();
            }
        });

        // page flip to next page
        document.getElementById("next-pg").addEventListener('click', function(){
            if(currentPageIndex < pages.length - 1){
                currentPageIndex++;
                renderCurrentPage();
            }
        });

        // blank page for new story
        document.getElementById("new-story-btn").addEventListener('click', function(){
            const newIndex = pages.length;
            pages.push({id: null, title: "nameless ✶⋆.˚", historyHtml: "", ideas: "", chatNote: ""});
            currentPageIndex = newIndex;
            saveToLocalStorage();
            renderCurrentPage();
        });


        // handles message submission and response from the backend 
        document.getElementById("chat-form").addEventListener('submit', async function(event){
            event.preventDefault(); // Prevents page reload
            
            const inputField = document.getElementById("user-input");
            const outputDiv = document.getElementById("chat-output");
            const userMessage = inputField.value.trim();

            if (!userMessage) return;

            // 1. Show your message in the chat immediately
            outputDiv.innerHTML += `<p class="user-msg"><b>user ✭ :</b> ${userMessage}</p>`;
            pages[currentPageIndex].historyHtml = outputDiv.innerHTML; 
            saveToLocalStorage();
            // 2. Clear input field and show temporary loading message

            inputField.value = "";
            const loadingMsg = document.createElement("p");
            loadingMsg.id = "loading-text";
            loadingMsg.innerHTML = `<i>"shush now, starry is thinking...". ⋆⭒˚｡⋆</i>`;
            outputDiv.appendChild(loadingMsg);

            try {
                // 3. Fetch reply from backend
                const formData = new FormData();
                formData.append('user_input', userMessage);
                formData.append('chat_id', pages[currentPageIndex].id);
                if (imageInput.files.length > 0) {
                    formData.append('image', imageInput.files[0]);
                }

                const response = await fetch('/chat', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.response || `Chat request failed (${response.status})`);
                }

                //4. save the chat id for future messages
                if (data.chat_id) {
                    pages[currentPageIndex].id = data.chat_id;
                }
                
                // 5. Remove loading text and append Starry's response
                document.getElementById("loading-text").remove();
                outputDiv.innerHTML += `<p class="starry-msg"><b>starry ✭ :</b> ${data.response}</p>`;
                pages[currentPageIndex].historyHtml = outputDiv.innerHTML;
                saveToLocalStorage();

            } catch (error) {
                console.error("Error:", error);
                if (document.getElementById("loading-text")) {
                    document.getElementById("loading-text").remove();
                }
                outputDiv.innerHTML += `<p style="color: #d1c4b2;"><b>Starry:</b> ${error.message}</p>`;
                pages[currentPageIndex].historyHtml = outputDiv.innerHTML;
                saveToLocalStorage();
            }
        }); 
        
        renderCurrentPage(); // Initial render of the first page

    </script>
</html>
